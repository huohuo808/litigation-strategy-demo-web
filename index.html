<style>
  :root{
    --navy:#16243b; --navy2:#22354f; --gold:#b0843f; --gold-soft:#f3e9d6;
    --bg:#f5f3ef; --card:#ffffff; --ink:#1d2733; --muted:#6b7683; --line:#e7e3da;
    --ok:#0f7a56; --ok-bg:#e6f4ee; --warn:#9a6700; --warn-bg:#fbf1d9; --dead:#9b3b3b; --dead-bg:#f8eaea;
    --att:#334eac; --att-bg:#eef1fb; --def:#8a4a8a; --def-bg:#f5eef5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#d9d5cc;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px 12px}
  .stage{display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .intro{width:300px;padding-top:40px;position:sticky;top:24px}
  .intro .logo{width:54px;height:54px;border-radius:15px;background:var(--navy);color:var(--gold-soft);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .intro h1{font-size:25px;color:var(--navy);font-weight:700;letter-spacing:.5px}
  .intro .en{font-size:12px;color:var(--gold);letter-spacing:2px;margin:4px 0 18px}
  .intro p{font-size:14px;line-height:1.8;color:#4a5563;margin-bottom:16px}
  .intro p strong{color:var(--navy)}
  .intro .tag{display:inline-block;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;margin:0 6px 6px 0;color:var(--navy2)}
  .intro .note{font-size:12px;color:#8a9099;line-height:1.7;margin-top:16px;border-left:3px solid var(--gold);padding-left:10px}
  .steps{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .steps h4{font-size:12px;color:var(--gold);letter-spacing:.5px;margin-bottom:10px}
  .steps .s{font-size:12.5px;color:#4a5563;padding:5px 0 5px 22px;position:relative;line-height:1.5}
  .steps .s:before{content:"";position:absolute;left:4px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--line)}
  .steps .s.on:before{background:var(--gold)}
  .steps .s.on{color:var(--navy);font-weight:600}
  .reset{font-size:12px;color:#fff;background:var(--navy);border:0;border-radius:9px;padding:9px 14px;cursor:pointer;margin-top:14px}
  .demo-hint{font-size:11px;text-align:left;color:#9a9186;margin-top:12px}

  .phone{width:392px;height:800px;background:var(--bg);border-radius:40px;border:9px solid var(--navy);box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative;overflow:hidden;display:flex;flex-direction:column}
  .bar{height:46px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;flex-shrink:0;font-weight:600}
  .bar .back{position:absolute;left:14px;font-size:22px;cursor:pointer;line-height:1}
  .bar .dot{position:absolute;right:16px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .screen{flex:1;overflow-y:auto;padding:18px 18px 84px}
  .screen::-webkit-scrollbar{width:0}
  .tabs{position:absolute;bottom:0;left:0;right:0;height:66px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5}
  .tabs div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);gap:3px;cursor:pointer}
  .tabs div.on{color:var(--navy);font-weight:600}
  .tabs .ic{font-size:19px}

  .brand{text-align:center;padding:22px 0 4px}
  .brand .lg{width:50px;height:50px;border-radius:14px;background:var(--navy);color:var(--gold-soft);font-size:25px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
  .brand h2{font-size:19px;color:var(--navy)}
  .brand p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
  .field{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600}
  .field select,.field textarea,.field input[type=text]{width:100%;border:0;outline:0;font-size:14px;color:var(--ink);background:transparent;font-family:inherit;resize:none}
  .field select{background:#faf9f6;border:1px solid var(--line);border-radius:8px;padding:8px}
  .field textarea{line-height:1.7;min-height:82px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;font-size:13px;padding:9px;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--navy2);cursor:pointer}
  .seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .up{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .filechip{font-size:12px;background:var(--gold-soft);color:#7a5a1e;border-radius:8px;padding:7px 10px}
  .upbtn{font-size:12px;border:1px dashed var(--gold);color:var(--gold);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}
  .primary{width:100%;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:15px;font-size:15px;cursor:pointer;font-weight:600;margin-top:4px}

var state = { view:'input', tab:'focus', checked:{}, flagged:{} };
var screen = document.getElementById('screen');
var tabs = document.getElementById('tabs');
var toastEl = document.getElementById('toast');
var sheetEl = document.getElementById('sheet');
var toastTimer;

function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){toastEl.classList.remove('show')},2200); }
function setStep(s){ document.querySelectorAll('.steps .s').forEach(function(el){ el.classList.toggle('on', el.getAttribute('data-s')===s || (s==='trace'&&el.getAttribute('data-s')==='strategy') || (s==='export'&&el.getAttribute('data-s')==='report')); }); }
function setTabs(active){ tabs.style.display = (state.view==='input'||state.view==='parse') ? 'none' : 'flex'; document.querySelectorAll('.tabs div').forEach(function(el){ el.classList.toggle('on', el.getAttribute('data-tab')===active); }); }
function setBar(title, back){ document.getElementById('barTitle').textContent=title; document.getElementById('back').style.display=back?'block':'none'; }

function render(){
  if(state.view==='input') renderInput();
  else if(state.view==='parse') renderParse();
  else if(state.view==='strategy') renderStrategy();
  else if(state.view==='report') renderReport();
}

// ===== 视图 1：案件输入 =====
function renderInput(){

  '<div class="brand"><div class="lg">策</div><h2>新建案件</h2><p>用大白话描述案情，AI 帮你搭策略框架</p></div>'+
  '<div class="field"><label>案由 / 案件类型</label><select id="fType"><option>民间借贷纠纷</option><option>买卖合同纠纷</option><option>劳动争议</option><option>离婚纠纷</option><option>交通事故人身损害赔偿</option></select></div>'+
  '<div class="field"><label>我方诉讼地位与目标</label><div class="seg"><button class="on" onclick="segRole(this,0)">原告</button><button onclick="segRole(this,1)">被告</button><button onclick="segRole(this,2)">第三人</button></div><input type="text" id="fGoal" value="'+CASE.goal+'" style="margin-top:10px;border-top:1px solid #f0ede6;padding-top:10px"></div>'+

function segRole(btn,idx){ btn.parentNode.querySelectorAll('button').forEach(function(b){b.classList.remove('on')}); btn.classList.add('on'); CASE.role=btn.textContent; }
function addFile(){ if(CASE.files.length>=5){toast('演示最多添加 5 份材料');return;} CASE.files.push('证据材料'+(CASE.files.length+1)+'.pdf'); renderInput(); toast('已添加材料（演示）'); }

// ===== 视图 2：AI 解析动画 =====
function startParse(){ state.view='parse'; render(); var logs=['正在读取案件材料，抽取关键事实…','识别案由：民间借贷纠纷…','定位争议焦点与法律关系…','召回权威法条与真实类案…','生成攻防路径与风险提示…']; var i=0; document.querySelectorAll('.parse .log div').forEach(function(el){el.classList.remove('show')}); var t=setInterval(function(){ if(i<logs.length){ var d=document.querySelectorAll('.parse .log div')[i]; if(d){d.classList.add('show'); d.textContent=logs[i];} i++; } else { clearInterval(t); setTimeout(function(){ state.view='strategy'; state.tab='focus'; render(); toast('策略草案已生成，请逐条核对'); },500); } },520); }
function renderParse(){

// ===== 视图 3：策略草案 =====
function renderStrategy(){

  var tabsHtml=[['focus','争议焦点'],['attack','攻防策略'],['evidence','证据清单'],['cases','类案参考'],['risk','风险提示']].map(function(t){return '<button class="'+(state.tab===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
  var body='';
  if(state.tab==='focus') body=focusHtml();
  else if(state.tab==='attack') body=attackHtml();
  else if(state.tab==='evidence') body=evidenceHtml();
  else if(state.tab==='cases') body=casesHtml();
  else if(state.tab==='risk') body=riskHtml();
  var n=Object.keys(state.checked).length, total=CASE.focus.length;

  '<div class="casebar"><div class="t">'+CASE.type+' · '+CASE.role+'</div><div class="m">目标：'+CASE.goal+'<br>案件编号 '+CASE.no+'</div></div>'+

function focusHtml(){

    '<div class="why"><b>为什么重要：</b>'+f.why+'</div>'+
    '<div class="basis">'+f.basis+'</div>'+
    '<div class="trace" onclick="openSrc('+i+')">查看依据原文与来源</div>'+
    '<div class="confirm"><button class="yes '+(ck==='ok'?'on':'')+'" onclick="check('+i+',\'ok\')">✓ 已核对无误</button><button class="no '+(fl?'on':'')+'" onclick="check('+i+',\'no\')">⚑ 有疑问</button></div>'+
    (fl?'<div class="basis" style="color:var(--dead)">已标记疑问：'+fl+'。可回到输入页补充事实后重新生成。</div>':'')+
    '</div>';
  }).join('');
}
function check(i,type){
  if(type==='ok'){ state.checked[i]='ok'; state.flagged[i]=''; toast('已标记为「核对无误」'); }
  else { state.flagged[i]='对方可能否认借条真实性等（演示）'; delete state.checked[i]; toast('已标记疑问，建议补充事实后重新生成'); }
  renderStrategy();
}
function attackHtml(){
  return '<div class="blk"><div class="h"><h4>攻防策略草案</h4><span class="bd ok">双视角</span></div>'+
  '<div class="duo"><div class="col att"><div class="lb">▸ 我方主张路径</div><ul>'+CASE.attack.ours.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>'+
  '<div class="col def"><div class="lb">▸ 对方可能抗辩 + 应对</div>'+CASE.attack.opp.map(function(o){return '<div style="margin-bottom:10px"><div style="font-size:12.5px;color:#5a3a5a;line-height:1.6">'+o.d+'</div><div class="counter"><b>应对：</b>'+o.c+'</div></div>'}).join('')+'</div></div></div>';
}
function evidenceHtml(){
  return '<div class="blk"><div class="h"><h4>证据清单建议</h4><span class="bd mid">主张 ↔ 证据配对</span></div>'+
  '<table class="ev"><tr><th>主张</th><th>所需证据</th><th>状态</th></tr>'+CASE.evidence.map(function(e){return '<tr><td>'+e.claim+'</td><td>'+e.ev+'</td><td><span class="bd '+(e.st==='已具备'?'ok':'miss')+'">'+e.st+'</span></td></tr>'}).join('')+'</table>'+
  '<div class="why">共 '+CASE.evidence.length+' 项，其中 '+CASE.evidence.filter(function(e){return e.st!=='已具备'}).length+' 项需补强——这是开庭前最该补的材料。</div></div>';
}
function casesHtml(){
  return CASE.cases.map(function(c){return '<div class="blk"><div class="h"><h4>'+c.no+'</h4><span class="bd low">'+c.tag+'</span></div><div class="why">'+c.hold+'</div><div class="basis">审理法院：'+c.court+'</div><div class="trace">查看裁判文书来源</div></div>'}).join('')+'<div class="disc">⚠ 类案为演示样本，正式版须替换为真实裁判文书并逐条核验来源。</div>';
}
function riskHtml(){
  return '<div class="blk"><div class="h"><h4>风险提示</h4><span class="bd mid">不构成胜诉承诺</span></div>'+CASE.risks.map(function(r){return '<div class="risk"><span class="ic">'+r.ic+'</span><span class="tx">'+r.tx+'</span><span class="bd '+(r.lv==='高'?'hi':(r.lv==='中'?'mid':'low'))+'">'+r.lv+'</span></div>'}).join('')+'</div>';
}
function openSrc(i){ var s=CASE.focus[i].src; sheetEl.style.display='flex'; sheetEl.innerHTML='<div class="inner"><div class="hh"><h3>依据溯源</h3><span class="x" onclick="closeSheet()">×</span></div><div class="srcblk"><div class="art">'+s.law+'</div><div class="full">'+s.full+'</div><div class="meta">发布机关：<b>'+s.org+'</b>　效力：<b style="color:var(--ok)">'+s.eff+'</b></div><div class="link">🔗 '+s.link+'</div><div class="basis" style="margin-top:14px;color:var(--muted)">这条依据来自权威库，可点开原文核对——这正是诉讼策略助手与通用 AI 的区别：不编造、可溯源。</div></div></div>'; }
function closeSheet(){ sheetEl.style.display='none'; }
sheetEl.addEventListener('click',function(e){ if(e.target===sheetEl) closeSheet(); });

// ===== 视图 4：导出报告 =====
function goExport(){ state.view='report'; state.checkedAll=true; render(); toast('策略报告已生成，可复制交付'); }
function renderReport(){
  setStep('export'); setTabs('report'); setBar('策略报告', true);
  screen.innerHTML =
  '<div class="done"><div class="ck">✓</div><h3 style="color:var(--navy);font-size:16px">策略草案已完成核对</h3><p style="font-size:12px;color:var(--muted);margin-top:6px">已生成结构化报告，可交付主办律师讨论</p></div>'+
  '<div class="report"><h3>诉讼策略草案</h3><div class="sub">'+CASE.type+' · '+CASE.no+' · '+CASE.role+'</div>'+
  '<h5>一、争议焦点与请求权基础</h5><ul>'+CASE.focus.map(function(f){return '<li><b>'+f.t+'</b>（'+f.lv+'）：'+f.why+'</li>'}).join('')+'</ul>'+
  '<h5>二、攻防策略</h5><p><b>我方路径：</b>'+CASE.attack.ours.join('；')+'</p><p><b>对方抗辩预判：</b>'+CASE.attack.opp.map(function(o){return o.d}).join('；')+'</p>'+
  '<h5>三、证据清单</h5><ul>'+CASE.evidence.map(function(e){return '<li>'+e.claim+' → '+e.ev+'（'+e.st+'）</li>'}).join('')+'</ul>'+
  '<h5>四、类案参考</h5><ul>'+CASE.cases.map(function(c){return '<li>'+c.no+'：'+c.hold+'</li>'}).join('')+'</ul>'+
  '<h5>五、风险提示</h5><ul>'+CASE.risks.map(function(r){return '<li>'+r.tx.replace(/<[^>]+>/g,'')+'</li>'}).join('')+'</ul>'+
  '<div class="disc" style="margin-top:14px;margin-bottom:0">⚠ '+CASE.disclaimer+'</div></div>'+
  '<button class="primary" onclick="copyReport()">复制报告全文</button>';
}
function copyReport(){
  var txt='诉讼策略草案\n'+CASE.type+' · '+CASE.no+' · '+CASE.role+'\n目标：'+CASE.goal+'\n\n';
  txt+='一、争议焦点与请求权基础\n'+CASE.focus.map(function(f,i){return (i+1)+'. '+f.t+'（'+f.lv+'）：'+f.why}).join('\n')+'\n\n';
  txt+='二、攻防策略\n我方路径：'+CASE.attack.ours.join('；')+'\n对方抗辩预判：'+CASE.attack.opp.map(function(o){return o.d+'；应对：'+o.c}).join('\n')+'\n\n';
  txt+='三、证据清单\n'+CASE.evidence.map(function(e){return e.claim+' → '+e.ev+'（'+e.st+'）'}).join('\n')+'\n\n';
  txt+='四、类案参考\n'+CASE.cases.map(function(c){return c.no+'：'+c.hold}).join('\n')+'\n\n';
  txt+='五、风险提示\n'+CASE.risks.map(function(r){return r.tx.replace(/<[^>]+>/g,'')}).join('\n')+'\n\n'+CASE.disclaimer;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast('报告已复制到剪贴板')}).catch(function(){toast('复制失败，请手动选择')}); }
  else { toast('当前环境不支持自动复制'); }
}

// ===== 导航 =====
function setTab(t){ state.tab=t; renderStrategy(); }
function switchTab(t){
  if(state.view==='input'||state.view==='parse'){ toast('请先生成策略草案'); return; }
  if(t==='case'){ state.view='strategy'; render(); }
  else if(t==='strategy'){ state.view='strategy'; render(); }
  else if(t==='report'){ state.view='report'; render(); }
}
function goBack(){ if(state.view==='parse'){ state.view='input'; render(); } else if(state.view==='strategy'){ state.view='input'; render(); } else if(state.view==='report'){ state.view='strategy'; render(); } }
function resetAll(){ state={view:'input',tab:'focus',checked:{},flagged:{}}; CASE.files=['借条.jpg','银行转账凭证.pdf','微信催收记录.png']; render(); toast('已重置演示'); }

render();
</script>
</body>
</html>
